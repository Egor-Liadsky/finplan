# Конфигурация Alembic.
#
# Строка подключения к БД намеренно не хранится здесь — раздел
# docs/architecture.md, 10.2: URL читается из окружения в migrations/env.py
# через finplan.config.get_settings(), чтобы пароль не попадал в файл,
# отслеживаемый git, и в логи.

[alembic]
script_location = migrations

# Имя файла ревизии: дата, время и слаг — проще ориентироваться в списке
# миграций, чем по одному хешу ревизии.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

[post_write_hooks]

# Логирование Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
