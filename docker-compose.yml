# Локальный стек разработки. За основу взят образец docs/architecture.md,
# раздел 10.3; отличия от образца перечислены и объяснены комментариями
# на месте, где они появляются.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finplan
      POSTGRES_USER: finplan
      POSTGRES_PASSWORD: finplan
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # Роли finplan_app и finplan_worker (раздел 4.5) заводит окружение, не
    # миграция: BYPASSRLS может выдать только суперпользователь, а пароли не
    # должны попадать в историю миграций Alembic. Скрипт инициализации
    # выполняется только на пустом томе PostgreSQL — после появления или
    # изменения этого файла локальный том пересоздаётся: `docker compose
    # down -v`, затем `docker compose up -d`.
    configs:
      - source: init_db_roles
        target: /docker-entrypoint-initdb.d/01-roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finplan"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    command: ["uvicorn", "finplan.entrypoints.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["./src:/app/src"]
    depends_on:
      postgres: {condition: service_healthy}
      # api пока не читает Redis напрямую (раздел 1.2: очередь вебхука и
      # идемпотентность появятся позже), но зависимость от healthcheck уже
      # задаётся здесь, чтобы не переписывать блок depends_on, когда
      # использование Redis в api появится.
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  bot:
    build: .
    command: ["python", "-m", "finplan.entrypoints.bot.main"]
    env_file: [.env]
    volumes: ["./src:/app/src"]
    depends_on:
      postgres: {condition: service_healthy}
      # bot переключает хранилище FSM на Redis, если REDIS_URL задан
      # (entrypoints/bot/main.py, раздел 10.1) — без здорового Redis
      # процесс не должен стартовать раньше него.
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["python", "-m", "finplan.entrypoints.worker.main"]
    env_file: [.env]
    volumes: ["./src:/app/src"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # Сервис frontend образца раздела 10.3 здесь не включён: каталог
  # frontend/ появится только на этапе 2 (раздел 13 «Этапы внедрения»), а
  # сервис docker-compose, ссылающийся на volume несуществующего каталога,
  # ломает поднятие всего стека командой `docker compose up`.

volumes:
  pgdata:

configs:
  # Пароли равны именам ролей и годятся только для локальной разработки
  # (раздел 4.5). Права на таблицы выдаёт миграция через GRANT — этот
  # скрипт только создаёт роли и их атрибуты login/bypassrls.
  # `$$` в теле DO-блока экранирован как `$$$$`: docker compose сам
  # выполняет подстановку переменных `$VAR`/`${VAR}` в значениях `content`,
  # поэтому одиночный `$$`, нужный PostgreSQL для dollar-quoting, превращается
  # в один `$` до того, как файл попадёт в контейнер.
  init_db_roles:
    content: |
      DO $$$$
      BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'finplan_app') THEN
              CREATE ROLE finplan_app LOGIN NOBYPASSRLS PASSWORD 'finplan_app';
          END IF;
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'finplan_worker') THEN
              CREATE ROLE finplan_worker LOGIN BYPASSRLS PASSWORD 'finplan_worker';
          END IF;
      END
      $$$$;
